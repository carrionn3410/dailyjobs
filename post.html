<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Post</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#FAF8F5}
  #c{width:1080px;height:1080px;background:#FAF8F5;position:relative;overflow:hidden;
     font-family:'Poppins',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}

  .photo{width:100%;height:460px;position:relative;overflow:visible}
  .photo img.bg{width:100%;height:460px;object-fit:cover;display:block}
  .veil{position:absolute;top:0;left:0;right:0;height:460px;
        background:linear-gradient(to bottom,rgba(0,0,0,.05) 0%,rgba(0,0,0,.78) 100%)}
  .brand{position:absolute;top:36px;left:44px;font-size:20px;font-weight:700;
         letter-spacing:3px;color:rgba(255,255,255,.92);text-transform:uppercase}
  .badge{position:absolute;bottom:-30px;left:44px;display:flex;align-items:center;
         background:#fff;border-radius:60px;padding:12px 30px 12px 20px;
         box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .badge img{width:46px;height:auto;border-radius:4px;margin-right:16px;display:block}
  .badge span{font-size:21px;font-weight:700;color:#1A1A2E;letter-spacing:.5px}

  .body{padding:78px 70px 0 70px}
  .title{font-weight:800;line-height:1.16;color:#1A1A2E;
         display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .row{margin-top:26px;display:flex;align-items:center}
  .ic{width:52px;height:52px;background:#FFE8DC;border-radius:15px;display:flex;
      align-items:center;justify-content:center;margin-right:18px;flex-shrink:0}
  .ic svg{width:27px;height:27px;fill:none;stroke:#C2511F;stroke-width:2;
          stroke-linecap:round;stroke-linejoin:round}
  .row .tx{font-size:29px;color:#333;font-weight:600;overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap}
  .row.loc .tx{font-size:26px;color:#555;font-weight:500}

  .foot{position:absolute;bottom:0;left:0;width:100%}
  .pay{background:#0F1A33;border-top:6px solid #F2C464;padding:22px 70px 18px 70px}
  .pay .lab{font-size:18px;font-weight:700;letter-spacing:4px;color:#F2C464}
  .pay .amt{font-weight:800;color:#fff;line-height:1.06;margin-top:4px}
  .pay .sub{font-size:22px;color:#AEBBD6;font-weight:600;margin-top:6px}
  .cta{background:#F2C464;padding:18px 70px;text-align:center;font-size:25px;
       font-weight:800;color:#0F1A33;letter-spacing:.3px}
  .warn{background:#0F1A33;padding:12px 70px;text-align:center;font-size:16px;
        font-weight:600;color:#8FA0C0}
</style>
</head>
<body>
<div id="c">
  <div class="photo">
    <img class="bg" id="ph" alt="">
    <div class="veil"></div>
    <div class="brand">FIND YOURSELF &middot; DAILY JOBS</div>
    <div class="badge"><img id="fl" alt=""><span id="cty"></span></div>
  </div>
  <div class="body">
    <div class="title" id="ti"></div>
    <div class="row">
      <div class="ic"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M2 13h20"/></svg></div>
      <div class="tx" id="en"></div>
    </div>
    <div class="row loc">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
      <div class="tx" id="li"></div>
    </div>
  </div>
  <div class="foot">
    <div class="pay">
      <div class="lab">GAJI / SALARY</div>
      <div class="amt" id="am"></div>
      <div class="sub" id="su"></div>
    </div>
    <div class="cta">LINK DI BIO &nbsp;&middot;&nbsp; KETIK &ldquo;INFO&rdquo; DI DM</div>
    <div class="warn">Lowongan resmi tidak pernah meminta uang di muka &middot; @findyourself.dailyjobs</div>
  </div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var g = function (k) { return (q.get(k) || "").trim(); };

  var titre = g("t"), entreprise = g("e"), lieu = g("l");
  var pays = g("p"), sal = g("s"), idr = g("r");

  // --- pays : nom affiche + drapeau ---------------------------------------
  var PAYS = [
    { k: "austral",  n: "AUSTRALIA",     c: "au" },
    { k: "cor",      n: "KOREA SELATAN", c: "kr" },
    { k: "korea",    n: "KOREA SELATAN", c: "kr" },
    { k: "jap",      n: "JEPANG",        c: "jp" },
    { k: "malai",    n: "MALAYSIA",      c: "my" },
    { k: "malay",    n: "MALAYSIA",      c: "my" },
    { k: "indon",    n: "INDONESIA",     c: "id" },
    { k: "singap",   n: "SINGAPURA",     c: "sg" },
    { k: "taiwan",   n: "TAIWAN",        c: "tw" }
  ];
  var pk = pays.toLowerCase()
            .replace(/[éèê]/g, "e")
            .replace(/[àâ]/g, "a");
  var inf = { n: pays.toUpperCase(), c: "" };
  for (var i = 0; i < PAYS.length; i++) {
    if (pk.indexOf(PAYS[i].k) > -1) { inf = PAYS[i]; break; }
  }
  document.getElementById("cty").textContent = inf.n;
  var fl = document.getElementById("fl");
  if (inf.c) { fl.src = "https://flagcdn.com/w80/" + inf.c + ".png"; }
  else { fl.style.display = "none"; }

  // --- photo : alternance quotidienne -------------------------------------
  //   jour "metier"   -> 5 visuels fixes choisis par domaine (comme avant)
  //   jour "paysage"  -> photo du pays (bush AU / skyline moderne KR, etc.)
  var B = "https://cdn.gamma.app/b569gvulqay45b8/design-anything/";
  var CATS = [
    { u: B + "5YYyYNLWy31AsI7NysWNY/v6idZQEenJx-SXjyTvZA1.jpg",
      k: ["farm","poultry","abalone","agricult","elevage","ferme","fisher","harvest","pick"] },
    { u: B + "eadtKbJUjc04sUZewewQu/LVT_LEUqoM1zzKoeQ9aTN.jpg",
      k: ["food","restaurant","chef","cuisine","kitchen","cook","waiter","barista","cafe"] },
    { u: B + "rPoksnuTvKY2PrCoHl36J/tB2uxBWYK6z3PpjPXSw5X.jpg",
      k: ["factory","production","usine","manufactur","sheet metal","insulation","assembly",
          "warehouse","entrepot","logistic","machin","equipment","welding","press"] },
    { u: B + "KyguTbeE9ouQvVyHYlpat/vwKS8I_CQjatuzmo2xBad.jpg",
      k: ["tire","mechanic","automotive","car parts","garage","vehicle","driver","truck"] },
    { u: B + "KyVDPtg5Q4jkB3YOPutx8/NuI2o0HqbnvqSrKwDZUgD.jpg",
      k: ["hotel","hospitality","tourism","tourisme","guest","front desk","concierge",
          "housekeep","cleaner","resort"] }
  ];
  var LAND = [
    { k: "austral", u: "https://images.unsplash.com/photo-1696560567583-c74195ada757?w=1080&q=80&fm=jpg&fit=crop" },
    { k: "cor",     u: "https://images.unsplash.com/photo-1723174391648-9e73f8865a12?w=1080&q=80&fm=jpg&fit=crop" },
    { k: "korea",   u: "https://images.unsplash.com/photo-1723174391648-9e73f8865a12?w=1080&q=80&fm=jpg&fit=crop" }
  ];

  // alterne chaque jour (UTC) : jour pair = metier, jour impair = paysage
  var dayIdx = Math.floor(Date.now() / 86400000);
  var mode = (dayIdx % 2 === 0) ? "sector" : "land";
  var mOverride = g("m"); // debug : ?m=sector ou ?m=land force le mode
  if (mOverride === "sector" || mOverride === "land") { mode = mOverride; }

  var pick = null;
  if (mode === "land") {
    for (var lg = 0; lg < LAND.length; lg++) {
      if (pk.indexOf(LAND[lg].k) > -1) { pick = LAND[lg].u; break; }
    }
  }
  if (!pick) {
    // pas de photo paysage pour ce pays (ou jour "metier") -> pick sectoriel
    var hay = (titre + " " + entreprise).toLowerCase();
    pick = CATS[4].u;
    for (var j = 0; j < CATS.length; j++) {
      for (var m2 = 0; m2 < CATS[j].k.length; m2++) {
        if (hay.indexOf(CATS[j].k[m2]) > -1) { pick = CATS[j].u; j = 99; break; }
      }
    }
  }
  document.getElementById("ph").src = pick;

  // --- textes --------------------------------------------------------------
  var ti = document.getElementById("ti");
  ti.textContent = titre;
  ti.style.fontSize = (titre.length > 78 ? 38 : titre.length > 52 ? 44 : 50) + "px";

  document.getElementById("en").textContent = entreprise;
  document.getElementById("li").textContent = lieu;

  // --- salaire -------------------------------------------------------------
  var am = document.getElementById("am"), su = document.getElementById("su");
  var big = idr || sal;
  am.textContent = big;
  am.style.fontSize = (big.length > 22 ? 40 : big.length > 16 ? 48 : 58) + "px";
  su.textContent = idr ? ("per bulan · " + sal) : "";

  document.documentElement.setAttribute("data-ready", "1");
})();
</script>
</body>
</html>
